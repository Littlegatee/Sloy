<div class="flex items-center justify-center min-h-[80vh]">
    <div class="pipe-block p-8 max-w-md w-full bg-surface">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-tr from-blue-500 to-purple-600 rounded-full flex items-center justify-center text-white text-3xl font-bold mx-auto mb-4 shadow-lg shadow-blue-500/30">
                С
            </div>
            <h1 class="text-2xl font-bold text-text">Создать аккаунт</h1>
            <p class="text-textMuted mt-2">Присоединяйтесь к СЛОЮ сегодня</p>
        </div>

        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-text mb-1">Имя</label>
                <input type="text" id="regFirstName" class="w-full px-4 py-2 bg-bg border border-border rounded-xl outline-none focus:border-primary transition-colors text-text" placeholder="Иван" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-text mb-1">Никнейм (ID)</label>
                <input type="text" id="regUsername" class="w-full px-4 py-2 bg-bg border border-border rounded-xl outline-none focus:border-primary transition-colors text-text" placeholder="ivan_cool" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-text mb-1">Email</label>
                <input type="email" id="regEmail" class="w-full px-4 py-2 bg-bg border border-border rounded-xl outline-none focus:border-primary transition-colors text-text" placeholder="example@email.com" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-text mb-1">Пароль</label>
                <input type="password" id="regPassword" class="w-full px-4 py-2 bg-bg border border-border rounded-xl outline-none focus:border-primary transition-colors text-text" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="w-full py-3 bg-primary text-white rounded-xl font-semibold hover:bg-blue-600 transition-colors shadow-lg shadow-primary/30 mt-4">
                Зарегистрироваться
            </button>
        </form>

        <div class="mt-8 text-center text-sm text-textMuted">
            Уже есть аккаунт? <a href="#" class="text-primary font-semibold hover:underline" onclick="app.router.navigate('auth')">Войти</a>
        </div>
    </div>
</div>
