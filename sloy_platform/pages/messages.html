<div class="h-[calc(100vh-6rem)] pipe-block bg-surface flex overflow-hidden">
    <!-- Список диалогов (левая колонка) -->
    <div class="w-full md:w-80 flex-shrink-0 border-r border-border flex flex-col h-full" id="dialogsListContainer">
        <!-- Шапка списка диалогов -->
        <div class="p-3 border-b border-border">
            <div class="relative">
                <input type="text" id="dialogSearch" class="w-full bg-bg border border-border rounded-xl py-2 pl-10 pr-4 text-sm outline-none focus:border-primary transition-colors text-text" placeholder="Поиск сообщений...">
                <i class="fas fa-search absolute left-3.5 top-2.5 text-textMuted text-sm"></i>
            </div>
        </div>
        
        <!-- Фильтры (опционально) -->
        <div class="px-3 pt-2 flex space-x-2 overflow-x-auto hide-scrollbar">
            <button class="px-3 py-1 bg-primary text-white text-xs font-medium rounded-full">Все</button>
            <button class="px-3 py-1 bg-bg text-textMuted hover:text-text text-xs font-medium rounded-full transition-colors">Непрочитанные</button>
        </div>

        <!-- Сам список -->
        <div class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1" id="dialogsList">
            <!-- Загружаются динамически -->
            <div class="text-center p-4 text-textMuted text-sm mt-4">
                Загрузка диалогов...
            </div>
        </div>
    </div>

    <!-- Область чата (правая колонка) -->
    <div class="flex-1 flex flex-col h-full hidden md:flex" id="chatArea">
        <!-- Пустое состояние -->
        <div id="chatEmptyState" class="flex-1 flex flex-col items-center justify-center text-textMuted hidden">
            <div class="w-20 h-20 bg-bg rounded-full flex items-center justify-center text-3xl mb-4">
                <i class="far fa-comments"></i>
            </div>
            <p>Выберите чат для начала общения</p>
        </div>

        <!-- Активный чат -->
        <div id="chatActiveState" class="flex-1 flex flex-col w-full h-full">
            <!-- Шапка чата -->
            <div class="h-14 border-b border-border flex items-center justify-between px-4 bg-surface shrink-0">
                <div class="flex items-center space-x-3">
                    <button class="md:hidden w-8 h-8 rounded-full hover:bg-bg flex items-center justify-center text-text" onclick="ui.messages.showDialogsList()">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <div class="relative cursor-pointer">
                        <img src="" id="activeChatAvatar" class="w-10 h-10 rounded-full object-cover bg-gray-200">
                        <div id="activeChatOnline" class="online-dot absolute bottom-0 right-0 w-3 h-3 border-2 border-surface"></div>
                    </div>
                    <div class="cursor-pointer">
                        <div class="font-semibold text-sm text-text" id="activeChatName">Имя контакта</div>
                        <div class="text-xs text-primary" id="activeChatStatus">онлайн</div>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button class="w-9 h-9 rounded-full hover:bg-bg flex items-center justify-center text-textMuted hover:text-primary transition-colors">
                        <i class="fas fa-search"></i>
                    </button>
                    <button class="w-9 h-9 rounded-full hover:bg-bg flex items-center justify-center text-textMuted hover:text-primary transition-colors">
                        <i class="fas fa-ellipsis-v"></i>
                    </button>
                </div>
            </div>

            <!-- Область сообщений -->
            <div class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar bg-bg relative" id="chatMessagesArea">
                <!-- Сообщения -->
            </div>

            <!-- Ввод сообщения -->
            <div class="p-3 bg-surface border-t border-border shrink-0">
                <div class="flex items-end space-x-2 max-w-4xl mx-auto">
                    <button class="w-10 h-10 shrink-0 rounded-full hover:bg-bg flex items-center justify-center text-textMuted hover:text-primary transition-colors">
                        <i class="fas fa-paperclip text-lg"></i>
                    </button>
                    <div class="flex-1 bg-bg border border-border rounded-2xl relative flex items-end min-h-[44px]">
                        <textarea 
                            id="messageInput" 
                            rows="1" 
                            class="w-full bg-transparent border-none outline-none py-3 pl-4 pr-10 text-sm text-text resize-none max-h-32 custom-scrollbar"
                            placeholder="Написать сообщение..."
                        ></textarea>
                        <button class="absolute right-2 bottom-2 w-7 h-7 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 flex items-center justify-center text-textMuted transition-colors">
                            <i class="far fa-smile text-lg"></i>
                        </button>
                    </div>
                    <button id="sendMessageBtn" class="w-11 h-11 shrink-0 bg-primary text-white rounded-full hover:bg-blue-600 flex items-center justify-center shadow-md transition-transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
