<div class="space-y-6">
    <div class="pipe-block p-4 sm:p-6 bg-surface">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-6 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-text">Сообщества</h1>
                <p class="text-textMuted text-sm mt-1">Группы и каналы по интересам</p>
            </div>
            <button class="px-5 py-2 bg-primary text-white rounded-xl font-semibold hover:bg-blue-600 transition-colors shadow-sm text-sm flex items-center justify-center">
                <i class="fas fa-plus mr-2"></i>Создать сообщество
            </button>
        </div>

        <div class="relative mb-6">
            <input type="text" id="communitySearch" class="w-full bg-bg border border-border rounded-xl py-3 pl-12 pr-4 text-sm outline-none focus:border-primary transition-colors text-text" placeholder="Поиск сообществ...">
            <i class="fas fa-search absolute left-4 top-3.5 text-textMuted text-lg"></i>
        </div>

        <!-- Табы -->
        <div class="flex space-x-2 mb-6 overflow-x-auto pb-2 hide-scrollbar border-b border-border">
            <button class="communities-tab active px-4 py-2 text-sm font-semibold border-b-2 border-primary text-primary transition-colors whitespace-nowrap" data-tab="my">
                Мои сообщества
            </button>
            <button class="communities-tab px-4 py-2 text-sm font-semibold border-b-2 border-transparent text-textMuted hover:text-text transition-colors whitespace-nowrap" data-tab="managed">
                Управление
            </button>
            <button class="communities-tab px-4 py-2 text-sm font-semibold border-b-2 border-transparent text-textMuted hover:text-text transition-colors whitespace-nowrap" data-tab="recommendations">
                Рекомендации
            </button>
        </div>

        <!-- Список -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="communitiesListContainer">
            <!-- Загружаются динамически -->
            <div class="col-span-full py-12 text-center text-textMuted">
                <div class="inline-block w-8 h-8 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></div>
            </div>
        </div>
    </div>
</div>
